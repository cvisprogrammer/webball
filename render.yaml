services:
  - type: web
    name: webball
    runtime: docker
    plan: starter
    numInstances: 1
    healthCheckPath: /healthz
    envVars:
      - key: DATA_DIR
        value: /app/.data
      - key: COOKIE_SECURE
        value: "true"
    disk:
      name: webball-games
      mountPath: /app/.data
      sizeGB: 1
